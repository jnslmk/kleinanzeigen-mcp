name: Renovate

on:
  schedule:
    # Weekly full pass over every enabled manager.
    - cron: "0 3 * * 1"
    # Hourly scraper-only pass: Kleinanzeigen's markup can change without
    # notice, so the upstream pin is the one dependency worth picking up
    # same-day. Everything except the pinned upstream repo is disabled in
    # this run.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select hourly upstream-only discovery
        env:
          HOURLY: ${{ github.event.schedule == '17 * * * *' }}
        run: |
          if [ "$HOURLY" = true ]; then
            jq '.packageRules += [{"matchPackageNames": ["!ebay-kleinanzeigen-api"], "enabled": false}]' \
              .github/renovate-config.json > "$RUNNER_TEMP/renovate.json"
          else
            cp .github/renovate-config.json "$RUNNER_TEMP/renovate.json"
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.1
        with:
          configurationFile: ${{ runner.temp }}/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
