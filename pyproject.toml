[project]
name = "kleinanzeigen-mcp"
version = "0.1.5"
description = "MCP server for Kleinanzeigen.de listing search"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.4.4",
]

# Runtime uses upstream's scraper modules; install their runtime dependencies
# directly because upstream no longer ships requirements.txt.

[project.scripts]
kleinanzeigen-mcp = "kleinanzeigen_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kleinanzeigen_mcp"]
